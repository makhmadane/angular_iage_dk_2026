
<div class="container mt-5">


  <form [formGroup]="productForm" (ngSubmit)="save()">
    <label>Name</label>
    <input type="text" formControlName="name" id="" class="form-control">
    @if (productForm.get('name')?.invalid && productForm.get('name')?.touched){
      <span class="text-danger">Le name est obligatoire</span>
    }
    <br>
    <label>Prix</label>
    <input type="text" formControlName="prixe" id="" class="form-control">
    <label>Description</label>
    <input type="text" formControlName="description" id="" class="form-control">
    <br>
    <button type="submit" class="btn btn-primary" [disabled]="this.productForm.invalid">Save</button>
  </form>

</div>
